<svg xmlns="http://www.w3.org/2000/svg" width="330" height="60" viewBox="0 0 330 60" role="img" aria-label="Play Open Piano in your browser">
  <title>Play Open Piano in your browser</title>
  <!--
    The button at the top of the README. Self-hosted rather than fetched from
    a badge service, and a solid accent fill so it reads the same against
    GitHub's light and dark backgrounds.
  -->
  <rect x="0.75" y="0.75" width="328.5" height="58.5" rx="12" fill="#2f6fdc" stroke="#1f4f9e" stroke-width="1.5"/>

  <!-- A one-octave keyboard, drawn the way the app draws it. -->
  <g transform="translate(20 15)">
    <rect width="44" height="30" rx="3" fill="#f6f7fa"/>
    <g stroke="#c6cddb" stroke-width="1">
      <line x1="6.3" y1="2" x2="6.3" y2="28"/>
      <line x1="12.6" y1="2" x2="12.6" y2="28"/>
      <line x1="18.9" y1="2" x2="18.9" y2="28"/>
      <line x1="25.1" y1="2" x2="25.1" y2="28"/>
      <line x1="31.4" y1="2" x2="31.4" y2="28"/>
      <line x1="37.7" y1="2" x2="37.7" y2="28"/>
    </g>
    <g fill="#161b23">
      <rect x="4.5" y="0" width="3.6" height="18" rx="1"/>
      <rect x="10.8" y="0" width="3.6" height="18" rx="1"/>
      <rect x="23.4" y="0" width="3.6" height="18" rx="1"/>
      <rect x="29.6" y="0" width="3.6" height="18" rx="1"/>
      <rect x="35.9" y="0" width="3.6" height="18" rx="1"/>
    </g>
  </g>

  <text x="80" y="30" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" dominant-baseline="central">Play Open Piano</text>
  <text x="80" y="46" fill="#d7e4fb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" dominant-baseline="central">Free, in your browser, no account</text>

  <path d="M 303 22 l 11 8 l -11 8 z" fill="#ffffff"/>
</svg>
